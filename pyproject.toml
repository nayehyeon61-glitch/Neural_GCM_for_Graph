[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralgcm-graph"
version = "0.1.0"
description = "Multiscale spherical graph context for NeuralGCM learned physics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "jax>=0.4.35",
  "dm-haiku>=0.0.13",
  "optax>=0.2.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
neuralgcm = [
  "neuralgcm @ git+https://github.com/neuralgcm/neuralgcm.git@56cfb4089a608413048fbc65d1ace60d5b1ae37d",
  "dinosaur @ git+https://github.com/neuralgcm/dinosaur.git@56edc85cbfe7e695f6063d58180a0f0b684cc1ae",
  "terrax @ git+https://github.com/neuralgcm/terrax.git@aaaf72045d4a7fb152e89164386914cbe51f6794",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the optional NeuralGCM and dinosaur dependencies"]
