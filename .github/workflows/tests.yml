name: Tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: [test, 'test,neuralgcm']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[${{ matrix.extras }}]' -c constraints-tested.txt
      - run: pytest -q
        env:
          JAX_PLATFORMS: cpu
